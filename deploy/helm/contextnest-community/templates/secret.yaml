{{- $data := include "contextnest-community.secretData" . | trim }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "contextnest-community.fullname" . }}
  labels:
    {{- include "contextnest-community.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $data | nindent 2 }}
{{- end }}
