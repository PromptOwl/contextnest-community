# deploy-dev.yml — auto-deploy the QA Cloud Run service `community-nest-dev`
# when a PR is merged into `development`. Mirrors dev-cloud-run/deploy-dev.ps1
# step-for-step: build + push image (always), then `gcloud run deploy`.
#
# This is the DEV pipeline only. A separate main/prod workflow will reuse the
# PROD_* secret names; dev secrets are DEV_* so the two never collide.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   GCP_DEV_SA_KEY                     base64 of the deployer service-account JSON key
#                                      (roles: run.admin, artifactregistry.writer,
#                                       iam.serviceAccountUser, storage.admin)
#                                      encode:  base64 -w0 key.json   (mac: base64 -i key.json)
#   DEV_DB_PASSWORD                    Postgres password for user `community`
#   DEV_PROMPTOWL_KEY                  License key (pk_...)
#   DEV_PROMPTOWL_BYPASS_SECRET        PromptOwl bypass secret
#   DEV_OFFICIAL_COMMUNITY_SSO_SECRET  SSO secret

name: Deploy dev (Cloud Run)

on:
  pull_request:
    types: [closed]
    branches: [development]
  workflow_dispatch: {}   # allow manual redeploy of the current development HEAD

# never let two dev deploys race
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    # PR path: only when actually merged (not just closed). Manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      PROJECT: theowl-462315
      REGION: us-central1
      SERVICE: community-nest-dev
      SERVICE_ACCOUNT: community-nest-data-dev@theowl-462315.iam.gserviceaccount.com
      BUCKET: community-nest-data-dev
      SQL_INSTANCE: theowl-462315:us-central1:litellm

    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Compute image tag
        id: tag
        run: echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate to Google Cloud
        env:
          GCP_DEV_SA_KEY: ${{ secrets.GCP_DEV_SA_KEY }}
        run: |
          set -euo pipefail
          [ -n "$GCP_DEV_SA_KEY" ] || { echo "::error::missing secret GCP_DEV_SA_KEY"; exit 1; }
          printf '%s' "$GCP_DEV_SA_KEY" | base64 -d > "$RUNNER_TEMP/gcp-key.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/gcp-key.json"
          gcloud config set project "$PROJECT"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # --- build + push (ps1: "Update docker image?" — always yes here) --------
      - name: Build and push image
        env:
          IMAGE_REPO: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/cloud-run-source-deploy/${{ env.SERVICE }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "$IMAGE_REPO:$IMAGE_TAG" \
            -t "$IMAGE_REPO:latest" .
          docker push "$IMAGE_REPO:$IMAGE_TAG"
          docker push "$IMAGE_REPO:latest"

      # --- env vars (ps1 $envPairs) — written to a file so no comma-splitting --
      - name: Write env-vars file
        env:
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          PROMPTOWL_KEY: ${{ secrets.DEV_PROMPTOWL_KEY }}
          PROMPTOWL_BYPASS_SECRET: ${{ secrets.DEV_PROMPTOWL_BYPASS_SECRET }}
          OFFICIAL_COMMUNITY_SSO_SECRET: ${{ secrets.DEV_OFFICIAL_COMMUNITY_SSO_SECRET }}
        run: |
          set -euo pipefail
          for v in DB_PASSWORD PROMPTOWL_KEY PROMPTOWL_BYPASS_SECRET OFFICIAL_COMMUNITY_SSO_SECRET; do
            [ -n "${!v}" ] || { echo "::error::missing secret DEV_$v"; exit 1; }
          done
          # single-quote each value; escape any embedded single quotes for YAML
          esc() { printf "%s" "$1" | sed "s/'/''/g"; }
          cat > env.yaml <<EOF
          AUTH_MODE: 'key'
          DB_DRIVER: 'postgres'
          CLOUD_SQL_CONNECTION_NAME: '${SQL_INSTANCE}'
          DB_USER: 'community'
          DB_NAME: 'community_nest_dev_data'
          DB_PASSWORD: '$(esc "$DB_PASSWORD")'
          NEST_STORAGE_ROOT: '/mnt/nests'
          DRIFT_SCAN_INTERVAL_MS: '0'
          PROMPTOWL_KEY: '$(esc "$PROMPTOWL_KEY")'
          PROMPTOWL_API_URL: 'https://dev.promptowl.ai'
          PROMPTOWL_BYPASS_SECRET: '$(esc "$PROMPTOWL_BYPASS_SECRET")'
          PUBLIC_BASE_URL: 'https://community-nest-dev-619135602958.us-central1.run.app/'
          OFFICIAL_COMMUNITY_SSO_SECRET: '$(esc "$OFFICIAL_COMMUNITY_SSO_SECRET")'
          EOF

      # --- deploy (ps1: gcloud run deploy, identical flags) --------------------
      - name: Deploy to Cloud Run
        env:
          IMAGE_REPO: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT }}/cloud-run-source-deploy/${{ env.SERVICE }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE_REPO:$IMAGE_TAG" \
            --clear-base-image --project="$PROJECT" --region="$REGION" \
            --service-account="$SERVICE_ACCOUNT" \
            --port=3838 --env-vars-file=env.yaml \
            --network=default --subnet=default --vpc-egress=private-ranges-only \
            --add-volume="name=nests,type=cloud-storage,bucket=$BUCKET" \
            --add-volume-mount="volume=nests,mount-path=/mnt/nests" \
            --add-cloudsql-instances="$SQL_INSTANCE" \
            --min-instances=1 --max-instances=1 --allow-unauthenticated

      - name: Clean up secrets on disk
        if: always()
        run: rm -f env.yaml "$RUNNER_TEMP/gcp-key.json"
