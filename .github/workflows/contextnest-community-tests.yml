# contextnest-community-tests.yml — Playwright e2e suite for ContextNest Community.
#
# Mirrors TheOwl's Playwright pipeline (theowl-tests.yml): manual dispatch +
# push to main, chromium-only install, ordered test-suite run against a
# deployed environment, CI dashboard in the run summary, HTML report + traces
# uploaded as an artifact.
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#   secrets.TEST_ACCOUNT1_USER   e2e account email (registered on the target server)
#   secrets.TEST_ACCOUNT1_PW     e2e account password
#   secrets.TEST_ACCOUNT2_USER   optional second account (multi-user stewardship tests)
#   secrets.TEST_ACCOUNT2_PW     optional second account password
#   secrets.VERCEL_BYPASS_SECRET Vercel protection bypass for the PromptOwl
#                                device-auth popup (dev.promptowl.ai)
#   vars.TEST_ACCOUNT1_METHOD    "promptowl" to sign account 1 in via device
#   vars.TEST_ACCOUNT2_METHOD    auth instead of the login form (default: manual)
#   vars.TEST_URL                target server URL (defaults to the QA Cloud Run
#                                alias https://nest-dev.promptowl.ai)

name: ContextNest Community Tests

on:
  # Runs on merge to main
  push:
    branches: [ "main" ]

  # Runs on PRs into development/main — also the only way to watch the
  # pipeline before the workflow file reaches main (workflow_dispatch is
  # offered by GitHub only for workflows present on the default branch)
  pull_request:
    branches: [ "main", "development" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run tests against'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      project:
        description: 'Playwright project to run'
        required: false
        default: 'test-suite'
        type: choice
        options:
          - test-suite
          - auth

env:
  NODE_VERSION: '20'

permissions:
  contents: read
  actions: read # the turnstile reads this workflow's other runs

# Every run drives the same shared test accounts on the same deployed server,
# so two runs at once collide: rate limits (429), 500s, and each deleting the
# other's data (the orphan sweep at the start of one run removed the live nests
# of another). So only one run may use the server at a time.
#
# That is NOT done with one repo-wide concurrency group: GitHub keeps only one
# pending run per group and cancels the older pending run when a new one
# arrives, so with several PRs pushing, most runs were cancelled before they
# started. Instead:
#   - this group is per PR (per run for pushes / manual runs), and a new
#     commit on a PR cancels that PR's older run, which is superseded anyway;
#   - the "Wait for the shared e2e server" step (tests/scripts/e2e-turnstile.mjs)
#     lets one run at a time past it, first come first served, and drops none.
concurrency:
  # Pushes and manual runs get their own group each (run_id), so a burst of
  # pushes to one ref can't drop a pending run either; the turnstile orders them.
  group: e2e-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Includes time waiting at the turnstile (it gives up after 120 minutes).
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Display run parameters
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🚀 Manual workflow triggered!"
          echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
          echo "Project: ${{ github.event.inputs.project || 'test-suite' }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only — every project uses Desktop Chrome
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Holds this run here until no other run is using the shared server.
      # The step name is read by other runs; keep it in sync with GATE_STEP.
      - name: Wait for the shared e2e server
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_TURNSTILE_MAX_MINUTES: '120'
        run: node tests/scripts/e2e-turnstile.mjs

      - name: Run Playwright tests
        env:
          TEST_ACCOUNT1_USER: ${{ secrets.TEST_ACCOUNT1_USER }}
          TEST_ACCOUNT1_PW: ${{ secrets.TEST_ACCOUNT1_PW }}
          TEST_ACCOUNT1_ALIAS: primary_user
          TEST_ACCOUNT1_METHOD: ${{ vars.TEST_ACCOUNT1_METHOD }}
          TEST_ACCOUNT2_USER: ${{ secrets.TEST_ACCOUNT2_USER }}
          TEST_ACCOUNT2_PW: ${{ secrets.TEST_ACCOUNT2_PW }}
          TEST_ACCOUNT2_ALIAS: secondary_user
          TEST_ACCOUNT2_METHOD: ${{ vars.TEST_ACCOUNT2_METHOD }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          BASE_URL: ${{ vars.TEST_URL || 'https://nest-dev.promptowl.ai' }}
          ENVIRONMENT_NAME: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          echo "🔐 Using test account credentials for E2E tests"
          echo "🌐 Testing against: $BASE_URL"
          echo "🏷️  Environment: $ENVIRONMENT_NAME"
          npx playwright test --project=${{ github.event.inputs.project || 'test-suite' }}

      # Renders directly in the Actions run tab (no download needed)
      - name: Generate CI Dashboard
        if: always()
        continue-on-error: true
        env:
          TEST_URL: ${{ vars.TEST_URL || 'https://nest-dev.promptowl.ai' }}
          PLAYWRIGHT_PROJECT: ${{ github.event.inputs.project || 'test-suite' }}
        run: node tests/scripts/generate-ci-summary.js

      # HTML report + traces, screenshots, videos
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/test-results/
          retention-days: 30
          if-no-files-found: warn
