# helm-chart.yml — checks for the Kubernetes chart in deploy/helm/contextnest-community.
#
# lint:  helm lint, helm template over the value sets in ci/ (including the
#        replica guard, which must refuse unsafe configs), and kubeconform
#        schema validation of every render. Runs ci/test.sh in a pinned
#        alpine/helm image, so the same command works on a laptop.
# kind:  builds the image from this PR, installs the chart on a kind cluster,
#        waits for Ready, checks /health, deletes the pod and confirms a nest
#        survived (ci/kind-smoke.sh). Before that, checks the image runs as
#        uid 1000 and refuses a root-owned /data with the chown fix.
# arm64: builds the image for linux/arm64 (QEMU, no push) and boots it until
#        /health answers, so a break in the second platform the release
#        publishes (e.g. a native module) shows up here, not at release.
#
# Images and actions are pinned by digest / commit SHA.

name: Helm chart

on:
  pull_request:
    branches: [ "development", "main" ]
    paths:
      - "deploy/helm/**"
      - "Dockerfile"
      - ".github/workflows/helm-chart.yml"
      # the boot check the root-owned-volume step exercises
      - "src/index.ts"
      - "src/shared/data-dir-check.ts"

permissions:
  contents: read

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: true

env:
  # alpine/helm:3.17.1
  HELM_IMAGE: alpine/helm@sha256:e8d29e13b8218a8cb7b117a10a5210922474a74467bf70b6f3f1f7d9c1818ab0
  # ghcr.io/yannh/kubeconform:v0.6.7
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c

jobs:
  lint:
    name: Lint, template, kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: helm lint + template + replica guard
        run: |
          mkdir -p "$RUNNER_TEMP/rendered"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/rendered:/out" -w /repo \
            --entrypoint sh "$HELM_IMAGE" deploy/helm/contextnest-community/ci/test.sh /out

      - name: kubeconform
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/rendered:/out:ro" \
            "$KUBECONFORM_IMAGE" -strict -summary /out

  kind:
    name: kind install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build -t contextnest-community:ci .

      - name: Image runs as uid 1000 and explains a root-owned /data
        run: |
          set -eu
          [ "$(docker run --rm --entrypoint id contextnest-community:ci -u)" = 1000 ]
          # A volume left root-owned by an older image. The file keeps it
          # non-empty: Docker re-copies the image's /data (owned by 1000) into
          # an empty volume on every mount.
          docker volume create rootowned
          docker run --rm --user 0 -v rootowned:/data --entrypoint sh contextnest-community:ci \
            -c 'touch /data/community.db && chown -R 0:0 /data && chmod 755 /data'
          cid=$(docker run -d -v rootowned:/data contextnest-community:ci)
          code=$(timeout 60 docker wait "$cid" || echo running)
          docker logs "$cid" > boot.log 2>&1
          docker rm -f "$cid" > /dev/null
          docker volume rm rootowned > /dev/null
          if [ "$code" = 0 ] || [ "$code" = running ]; then
            echo "expected the server to refuse a root-owned /data (got: $code)"; cat boot.log; exit 1
          fi
          grep -q "DATA_ROOT /data is not writable" boot.log
          grep -q "chown -R 1000:1000" boot.log

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: chart-ci

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.1

      - name: Install chart and check it
        env:
          IMAGE: contextnest-community:ci
        run: |
          kind load docker-image "$IMAGE" --name chart-ci
          sh deploy/helm/contextnest-community/ci/kind-smoke.sh

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get all,pvc -o wide || true
          kubectl describe pods || true
          kubectl logs -l app.kubernetes.io/instance=cn --tail=200 || true

  arm64:
    name: Image builds for arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: contextnest-community:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Boot it under QEMU and check /health
        run: |
          set -eu
          cid=$(docker run -d --platform linux/arm64 contextnest-community:arm64)
          for i in $(seq 1 60); do
            if docker exec "$cid" node -e "fetch('http://127.0.0.1:3838/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "arm64 /health ok"; docker rm -f "$cid" > /dev/null; exit 0
            fi
            sleep 5
          done
          docker logs "$cid" | tail -50; docker rm -f "$cid" > /dev/null; exit 1
