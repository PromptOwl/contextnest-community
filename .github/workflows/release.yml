name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: "ci(changesets): version packages"
          title: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # setup-node's npmrc reads NODE_AUTH_TOKEN, not NPM_TOKEN. Without
          # this, npm publishes unauthenticated and the registry masks the
          # rejection as a 404 on the PUT.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The version PR is already merged by the time changesets publishes, so
      # package.json holds exactly the version that just went to npm.
      - name: Read published version
        id: version
        if: steps.changesets.outputs.published == 'true'
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Same version to Docker Hub. Kept as a dependent job rather than a tag
  # trigger because tags pushed with GITHUB_TOKEN don't start new workflows.
  docker:
    name: Docker Hub
    needs: release
    if: needs.release.outputs.published == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      latest: true
    secrets: inherit

