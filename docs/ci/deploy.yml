# Proposed .github/workflows/deploy.yml (move it there; the Claude app cannot write to .github/workflows).
#
# Manual deploy (Actions -> Deploy (Cloud Run) -> Run workflow): pick `dev` or `prod`,
# optionally a ref. Builds the image, pushes it to Artifact Registry, and rolls the
# environment's Cloud Run service to it.
#
# Env vars are deliberately NOT managed here. `gcloud run deploy --image` keeps
# the service's existing env vars, secrets, volumes, Cloud SQL and VPC settings,
# so edit them on the Cloud Run service itself and they survive every deploy.
#
# Auth: Workload Identity Federation (no JSON key stored in GitHub).
# Create two GitHub Environments, `dev` and `prod` (Settings -> Environments). Add
# required reviewers on `prod` to gate production deploys. On each environment set
# these variables (they differ per environment, so the workflow has no per-env code):
#   GCP_WIF_PROVIDER   projects/<NUM>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>
#   GCP_DEPLOY_SA      deployer@<project>.iam.gserviceaccount.com
#   GCP_PROJECT        GCP project id of the environment
#   CLOUD_RUN_SERVICE  Cloud Run service name (e.g. community-nest-dev / community-nest-prod)
# Optional: GCP_REGION (default us-central1), AR_REPO (default cloud-run-source-deploy).
# If the WIF provider's attribute condition pins a branch, allow the ref you deploy from.

name: Deploy (Cloud Run)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, prod]
        default: dev
        required: true
      ref:
        description: Branch, tag or SHA to deploy (blank = the branch selected above)
        type: string
        required: false

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT: ${{ vars.GCP_PROJECT }}
      REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      AR_REPO: ${{ vars.AR_REPO || 'cloud-run-source-deploy' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image names
        id: img
        run: |
          echo "repo=$REGION-docker.pkg.dev/$PROJECT/$AR_REPO/$SERVICE" >> "$GITHUB_OUTPUT"
          echo "tag=$ENVIRONMENT-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      # `latest` lives under the per-service image name, so dev and prod never share it.
      - name: Build and push image
        run: |
          docker build --platform linux/amd64 \
            -t "${{ steps.img.outputs.repo }}:${{ steps.img.outputs.tag }}" \
            -t "${{ steps.img.outputs.repo }}:latest" .
          docker push "${{ steps.img.outputs.repo }}:${{ steps.img.outputs.tag }}"
          docker push "${{ steps.img.outputs.repo }}:latest"

      - name: Deploy to Cloud Run (image only; config stays as set on the service)
        run: |
          gcloud run deploy "$SERVICE" \
            --image="${{ steps.img.outputs.repo }}:${{ steps.img.outputs.tag }}" \
            --project="$PROJECT" --region="$REGION"
