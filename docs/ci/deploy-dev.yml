# Proposed .github/workflows/deploy-dev.yml (move it there; the Claude app cannot write to .github/workflows).
#
# On every push to `development` (PR merge or direct commit): build the image,
# push it to Artifact Registry, and roll Cloud Run to it.
#
# Env vars are deliberately NOT managed here. `gcloud run deploy --image` keeps
# the service's existing env vars, secrets, volumes, Cloud SQL and VPC settings,
# so edit them on the Cloud Run service itself and they survive every deploy.
#
# Auth: Workload Identity Federation (no JSON key stored in GitHub).
# Required repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   GCP_WIF_PROVIDER   projects/<NUM>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>
#   GCP_DEPLOY_SA      deployer@theowl-462315.iam.gserviceaccount.com

name: Deploy dev (Cloud Run)

on:
  push:
    branches: [development]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  PROJECT: theowl-462315
  REGION: us-central1
  SERVICE: community-nest-dev
  IMAGE_REPO: us-central1-docker.pkg.dev/theowl-462315/cloud-run-source-deploy/community-nest-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 \
            -t "$IMAGE_REPO:${{ steps.tag.outputs.tag }}" -t "$IMAGE_REPO:latest" .
          docker push "$IMAGE_REPO:${{ steps.tag.outputs.tag }}"
          docker push "$IMAGE_REPO:latest"

      - name: Deploy to Cloud Run (image only; config stays as set on the service)
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE_REPO:${{ steps.tag.outputs.tag }}" \
            --project="$PROJECT" --region="$REGION"
