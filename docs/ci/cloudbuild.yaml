# Option B: Cloud Build trigger (no GitHub credentials, no WIF).
#
# Proposed cloudbuild.yaml shared by dev and prod. Create one trigger per environment
# on this file; the triggers differ only in their substitutions:
#   dev : _ENV=dev  _SERVICE=community-nest-dev
#   prod: _ENV=prod _SERVICE=community-nest-prod   (service names are examples; adjust)
# Use a "Manual invocation" trigger for each to get the same pick-the-environment flow as
# workflow_dispatch (Cloud Build -> Triggers -> Run, choosing the branch/tag). Or use a push
# trigger (e.g. ^development$ for dev). For prod, enable trigger approval.
#
# Setup (once, in the GCP console or with gcloud):
#   1. Cloud Build -> Triggers -> Create trigger
#        - Source: PromptOwl/contextnest-community (connect via the Cloud Build GitHub app)
#        - Config: Cloud Build configuration file, path docs/ci/cloudbuild.yaml
#        - Substitution variables: _ENV and _SERVICE as above
#   2. Grant the trigger's service account (default: <PROJECT_NUMBER>@cloudbuild.gserviceaccount.com,
#      or a dedicated one you pick on the trigger):
#        - roles/artifactregistry.writer
#        - roles/run.admin
#        - roles/iam.serviceAccountUser (on the Cloud Run runtime service account)
#   Images go to the project the build runs in ($PROJECT_ID), so dev and prod in separate
#   GCP projects each use their own registry.
#
# Like the GitHub Actions option, this only swaps the image. `gcloud run deploy --image`
# keeps the service's existing env vars, secrets, volumes, Cloud SQL and VPC settings,
# so edit those on the Cloud Run service itself.

substitutions:
  _ENV: dev
  _REGION: us-central1
  _SERVICE: community-nest-dev
  _REPO: cloud-run-source-deploy

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_ENV}-$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${_ENV}-$SHORT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID

options:
  logging: CLOUD_LOGGING_ONLY
